services:
  web:
    build: .
    container_name: bonus_system_web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

  db:
    image: postgres:15
    container_name: bonus_system_postgres

    environment:
      POSTGRES_DB: db_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: