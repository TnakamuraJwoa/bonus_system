services:
  web:
    build: .
    container_name: bonus_system_web

    env_file:
      - .env

    command: gunicorn connect_app.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: bonus_system_nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles

    depends_on:
      - web

  db:
    image: postgres:15
    container_name: bonus_system_postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  static_volume: