<div class="form-group">
  <label class="form-label small text-muted">キャンペーン</label>
  <select name="campaign_id" class="form-control" required>
    <option value="">選択してください</option>
    {% for campaign in campaigns %}
    <option value="{{ campaign.id }}" {% if row and row.campaign_id == campaign.id %}selected{% endif %}>
      {{ campaign.campaign_code }}｜{{ campaign.campaign_name|truncatechars:30 }}{% if campaign.status == 0 %}（無効）{% endif %}
    </option>
    {% endfor %}
  </select>
</div>

<div class="form-row">
  <div class="form-group col-6">
    <label class="form-label small text-muted">会員ID</label>
    <input type="text"
           name="jwoa_code"
           class="form-control"
           maxlength="20"
           value="{{ row.jwoa_code|default:'' }}"
           required>
  </div>

  <div class="form-group col-6">
    <label class="form-label small text-muted">ボーナス金額</label>
    <input type="number"
           name="bonus_amount"
           class="form-control"
           step="1"
           min="0"
           value="{{ row.bonus_amount|default:0|floatformat:0 }}">
  </div>
</div>

<div class="form-row">
  <div class="form-group col-4">
    <label class="form-label small text-muted">対象状態</label>
    <select name="eligible_status" class="form-control">
      <option value="1" {% if not row or row.eligible_status == 1 %}selected{% endif %}>対象</option>
      <option value="0" {% if row and row.eligible_status == 0 %}selected{% endif %}>対象外</option>
    </select>
  </div>

  <div class="form-group col-4">
    <label class="form-label small text-muted">支払状態</label>
    <select name="payment_status" class="form-control">
      <option value="0" {% if not row or row.payment_status == 0 %}selected{% endif %}>未払い</option>
      <option value="1" {% if row and row.payment_status == 1 %}selected{% endif %}>支払済</option>
    </select>
  </div>

  <div class="form-group col-4">
    <label class="form-label small text-muted">支払日</label>
    <input type="date"
           name="payment_date"
           class="form-control"
           value="{{ row.payment_date|date:'Y-m-d' }}">
  </div>
</div>

<div class="form-group mb-0">
  <label class="form-label small text-muted">備考</label>
  <textarea name="note"
            rows="3"
            class="form-control"
            maxlength="500">{{ row.note|default:'' }}</textarea>
</div>
