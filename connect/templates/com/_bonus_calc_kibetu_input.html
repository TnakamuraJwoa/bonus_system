<div class="bonus-calc-kibetu-field">
  <div class="d-flex justify-content-between align-items-center mb-1">
    <label class="form-label mb-0 small text-muted">期別</label>
    {% if period_type == "weekly" %}
      <div class="btn-group btn-group-sm" role="group" aria-label="期別候補の表示切替">
        <button type="button"
                onclick="this.closest('form').querySelector('input[name=kibetu_choice_mode]').value='recent'; this.closest('form').submit();"
                class="btn {% if kibetu_choice_mode == 'recent' %}btn-primary{% else %}btn-outline-secondary{% endif %}">
          直近半年
        </button>
        <button type="button"
                onclick="this.closest('form').querySelector('input[name=kibetu_choice_mode]').value='all'; this.closest('form').submit();"
                class="btn {% if kibetu_choice_mode == 'all' %}btn-primary{% else %}btn-outline-secondary{% endif %}">
          全件
        </button>
      </div>
    {% endif %}
  </div>
  <div class="bonus-calc-kibetu-select" data-kibetu-dropdown>
    <input type="text"
           name="kibetu"
           class="form-control bonus-calc-kibetu-input"
           value="{{ selected_kibetu|default:'' }}"
           placeholder="期別を入力または選択"
           autocomplete="off"
           aria-expanded="false"
           required>
    <button type="button"
            class="bonus-calc-kibetu-toggle"
            aria-label="期別候補を開く"
            tabindex="-1">
      ▾
    </button>
    <div class="bonus-calc-kibetu-options" role="listbox">
      {% for obj in period_choices %}
        <button type="button"
                class="bonus-calc-kibetu-option{% if obj.kibetu == next_completion_kibetu %} bonus-calc-kibetu-option--next{% endif %}{% if obj.kibetu == previous_month_kibetu %} bonus-calc-kibetu-option--previous-month{% endif %}"
                data-kibetu-value="{{ obj.kibetu }}"
                data-kibetu-search="{{ obj.kibetu }} {{ obj.st_date }} {{ obj.end_date }} {{ obj.payment_date }}">
          <span class="bonus-calc-kibetu-option__title">
            {{ obj.kibetu }}
          </span>
          <span class="bonus-calc-kibetu-option__separator"> </span>
          <span class="bonus-calc-kibetu-option__meta">
            {% if period_type == "monthly" %}
              {% if obj.payment_date %}{{ obj.payment_date }}{% else %}日付未設定{% endif %}
            {% else %}
              {% if obj.st_date %}{{ obj.st_date }} - {{ obj.end_date }}{% else %}日付未設定{% endif %}
            {% endif %}
          </span>
          {% if obj.kibetu == previous_month_kibetu %}
            <span class="bonus-calc-kibetu-option__badge bonus-calc-kibetu-option__badge--previous-month">前月</span>
          {% endif %}
          {% if obj.kibetu == next_completion_kibetu %}
            <span class="bonus-calc-kibetu-option__badge-row">
              <span class="bonus-calc-kibetu-option__badge">次の完成日</span>
            </span>
          {% endif %}
        </button>
      {% endfor %}
    </div>
  </div>
  {% if period_type == "weekly" %}
    <input type="hidden" name="kibetu_choice_mode" value="{{ kibetu_choice_mode }}">
  {% endif %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll("[data-kibetu-dropdown]").forEach(function(dropdown) {
    var input = dropdown.querySelector(".bonus-calc-kibetu-input");
    var toggle = dropdown.querySelector(".bonus-calc-kibetu-toggle");
    var options = Array.from(dropdown.querySelectorAll(".bonus-calc-kibetu-option"));

    function setOpen(isOpen) {
      dropdown.classList.toggle("is-open", isOpen);
      input.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }

    function filterOptions() {
      var keyword = input.value.trim().toLowerCase();
      options.forEach(function(option) {
        var searchText = (option.dataset.kibetuSearch || "").toLowerCase();
        option.hidden = keyword && searchText.indexOf(keyword) === -1;
      });
    }

    input.addEventListener("focus", function() {
      filterOptions();
      setOpen(true);
    });

    input.addEventListener("input", function() {
      filterOptions();
      setOpen(true);
    });

    toggle.addEventListener("click", function() {
      filterOptions();
      setOpen(!dropdown.classList.contains("is-open"));
      input.focus();
    });

    options.forEach(function(option) {
      option.addEventListener("click", function() {
        input.value = option.dataset.kibetuValue || "";
        setOpen(false);
        input.focus();
      });
    });

    document.addEventListener("click", function(event) {
      if (!dropdown.contains(event.target)) {
        setOpen(false);
      }
    });
  });
});
</script>
