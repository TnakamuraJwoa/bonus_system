<div class="form-group">
  <label class="form-label small text-muted">キャンペーンコード</label>
  <input type="text"
         name="campaign_code"
         class="form-control"
         maxlength="50"
         placeholder="例: CP202607"
         value="{{ row.campaign_code|default:'' }}"
         required>
</div>

<div class="form-group">
  <label class="form-label small text-muted">キャンペーン名</label>
  <input type="text"
         name="campaign_name"
         class="form-control"
         maxlength="255"
         placeholder="例: 2026年7月キャンペーン"
         value="{{ row.campaign_name|default:'' }}"
         required>
</div>

<div class="form-row">
  <div class="form-group col-6">
    <label class="form-label small text-muted">開始日</label>
    <input type="date"
           name="start_date"
           class="form-control"
           value="{{ row.start_date|date:'Y-m-d' }}">
  </div>

  <div class="form-group col-6">
    <label class="form-label small text-muted">終了日</label>
    <input type="date"
           name="end_date"
           class="form-control"
           value="{{ row.end_date|date:'Y-m-d' }}">
  </div>
</div>

<div class="form-row">
  <div class="form-group col-6">
    <label class="form-label small text-muted">表示順</label>
    <input type="number"
           name="display_order"
           class="form-control"
           value="{{ row.display_order|default:0 }}">
  </div>

  <div class="form-group col-6">
    <label class="form-label small text-muted">状態</label>
    <select name="status" class="form-control">
      <option value="1" {% if not row or row.status == 1 %}selected{% endif %}>有効</option>
      <option value="0" {% if row and row.status == 0 %}selected{% endif %}>無効</option>
    </select>
  </div>
</div>

<div class="form-group mb-0">
  <label class="form-label small text-muted">概要</label>
  <textarea name="description"
            rows="4"
            class="form-control"
            maxlength="1000">{{ row.description|default:'' }}</textarea>
</div>
