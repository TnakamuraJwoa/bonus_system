{% load custom_filters %}
{% bonus_help help_key help_title as help_data %}

<div class="d-flex align-items-center gap-2 mb-3">
  <h5 class="page-title mb-0">{{ title }}</h5>
  <button
    type="button"
    class="btn btn-sm btn-outline-info rounded-circle bonus-help-button"
    data-toggle="modal"
    data-target="#bonusHelpModal_{{ help_key }}"
    aria-label="{{ help_title }}の説明を表示"
    title="説明を表示"
    style="width: 1.65rem; height: 1.65rem; padding: 0; line-height: 1;"
  >
    ?
  </button>
  {% if history_modal_id %}
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary rounded-circle bonus-history-button"
      data-toggle="modal"
      data-target="#{{ history_modal_id }}"
      aria-label="{{ history_title|default:'登録履歴を表示' }}"
      title="{{ history_title|default:'登録履歴を表示' }}"
      style="width: 1.65rem; height: 1.65rem; padding: 0; line-height: 1;"
    >
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M4 1.5A1.5 1.5 0 0 1 5.5 0h4.38c.4 0 .78.16 1.06.44l2.62 2.62c.28.28.44.66.44 1.06v10.38A1.5 1.5 0 0 1 12.5 16h-7A1.5 1.5 0 0 1 4 14.5v-13Zm5.5.1V4a1 1 0 0 0 1 1h2.4L9.5 1.6ZM6 7a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1H6Zm0 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1H6Zm0 2.5a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1H6Z"/>
      </svg>
    </button>
  {% endif %}
  {% if import_modal_id and user_access.can_execute %}
    <button
      type="button"
      class="btn btn-sm btn-outline-success rounded-circle bonus-import-button"
      data-toggle="modal"
      data-target="#{{ import_modal_id }}"
      aria-label="{{ import_title|default:'一括登録' }}"
      title="{{ import_title|default:'一括登録' }}"
      style="width: 1.65rem; height: 1.65rem; padding: 0; line-height: 1;"
    >
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M8 1a.5.5 0 0 1 .5.5v7.3l2.15-2.15a.5.5 0 0 1 .7.7l-3 3a.5.5 0 0 1-.7 0l-3-3a.5.5 0 1 1 .7-.7L7.5 8.8V1.5A.5.5 0 0 1 8 1ZM2.5 10a.5.5 0 0 1 .5.5V13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0V13a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5Z"/>
      </svg>
    </button>
  {% endif %}
</div>

<div
  class="modal fade bonus-help-modal"
  id="bonusHelpModal_{{ help_key }}"
  tabindex="-1"
  role="dialog"
  aria-labelledby="bonusHelpModalLabel_{{ help_key }}"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="bonusHelpModalLabel_{{ help_key }}">{{ help_data.title }}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="閉じる">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="bonus-help-content">
          {{ help_data.content|linebreaksbr }}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll(".bonus-help-modal, .bonus-history-modal, .bonus-import-modal").forEach(function(modal) {
    if (modal.parentElement !== document.body) {
      document.body.appendChild(modal);
    }
  });
});
</script>
