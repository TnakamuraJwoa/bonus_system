{% extends 'base.html' %}
{% load static %}

{% block contents %}

<div class="container mt-4">

    <h4 class="mb-3">タイトル一覧</h4>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>タイトルID</th>
            <th>タイトル名</th>
        </tr>
        </thead>
        <tbody>
        {% for obj in object_list %}
        <tr>
            <td>{{ obj.title_id }}</td>
            <td>{{ obj.title_name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center">データがありません</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
